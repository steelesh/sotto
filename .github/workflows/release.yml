name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag names the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - name: install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - name: package the vs code extension
        run: mise run vscode
      - name: package the jetbrains plugin
        run: mise run jetbrains
      - name: package the jetbrains icons plugin
        run: mise run jetbrains:icons
      - name: keep the packages for the publish jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/sotto-*.vsix
            dist/sotto-jetbrains.zip
            dist/sotto-icons-*.zip
            dist/sotto.icls
            dist/sotto-black.icls
          if-no-files-found: error
          retention-days: 7

  vscode:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - name: install the locked publishing tools
        run: mise run install
      - name: fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: publish to the vs code marketplace with trusted publishing
        run: mise exec -- vsce publish --oidc --skip-duplicate --packagePath dist/sotto-*.vsix

  openvsx:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - name: install the locked publishing tools
        run: mise run install
      - name: fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: publish to open vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          : "${OVSX_PAT:?release environment is missing OVSX_PAT}"
          mise exec -- ovsx publish --skip-duplicate --packagePath dist/sotto-*.vsix

  jetbrains:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: publish to the jetbrains marketplace
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        shell: bash
        run: |
          : "${JETBRAINS_TOKEN:?release environment is missing JETBRAINS_TOKEN}"
          version="${GITHUB_REF_NAME#v}"
          publish() {
            local plugin_id="$1" archive="$2" matches
            matches=$(curl --fail --silent --show-error --retry 3 --get \
              --data-urlencode "version=$version" \
              "https://plugins.jetbrains.com/api/plugins/$plugin_id/updates" | \
              jq -er --arg version "$version" '
                if type == "array" then
                  map(select(.version == $version and .channel == "")) | length
                else error("expected a list of plugin updates") end')
            if (( matches > 0 )); then
              echo "::notice::$archive $version is already on JetBrains Marketplace"
              return 0
            fi
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $JETBRAINS_TOKEN" \
              --form "pluginId=$plugin_id" \
              --form "file=@$archive" \
              https://plugins.jetbrains.com/api/updates/upload
          }
          publish 36124 dist/sotto-jetbrains.zip
          publish 36126 "dist/sotto-icons-$version.zip"

  github:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: publish the github release with the packages attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
